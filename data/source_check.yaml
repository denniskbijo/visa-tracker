# Snapshot of figures we expect to still appear on the official gov.uk pages.
# On the 1st of each month the source-check workflow fetches these pages.
# If every marker is still present it opens a pull request that bumps
# last_checked. If any marker is missing it opens an issue and leaves
# last_checked alone. `make check-sources` still fails when last_checked
# is older than max_age_days.
last_checked: "2026-11-15"
max_age_days: 45

sources:
  - id: appendix-skilled-worker
    url: https://www.gov.uk/guidance/immigration-rules/immigration-rules-appendix-skilled-worker
    must_contain:
      - "41,700"

  - id: appendix-skilled-occupations
    url: https://www.gov.uk/guidance/immigration-rules/immigration-rules-appendix-skilled-occupations
    must_contain:
      - "Programmers and software development professionals"
      - "54,700"
      - "Cyber security professionals"

  - id: appendix-immigration-salary-list
    url: https://www.gov.uk/guidance/immigration-rules/immigration-rules-appendix-immigration-salary-list
    must_contain:
      - "Biological scientists"
      - "Graphic and multimedia designers"

  # Senior or Specialist Worker general threshold (SNR 8.1).
  - id: appendix-global-business-mobility
    url: https://www.gov.uk/guidance/immigration-rules/immigration-rules-appendix-global-business-mobility-routes
    must_contain:
      - "52,500"
