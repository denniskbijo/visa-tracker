visa_routes:
  - slug: skilled-worker
    name: Skilled Worker
    description: >
      The main work visa route. Requires a licensed sponsor, a job offer in an eligible
      SOC code, and a salary meeting the general threshold or the going rate, whichever
      is higher. First-time applicants need English at CEFR B2.
    requires_sponsor: true
    requires_endorsement: false
    salary_threshold_pence: 4170000   # £41,700/yr general threshold (from 22 Jul 2025)
    duration_years: 5

  - slug: global-talent
    name: Global Talent
    description: >
      For leaders and emerging talent in tech, science, engineering, arts, and humanities.
      Digital technology endorsement is assessed by Tech Nation via the GOV.UK Stage 1
      form. No sponsor or salary floor needed.
    requires_sponsor: false
    requires_endorsement: true
    salary_threshold_pence: 0
    duration_years: 5

  - slug: high-potential-individual
    name: High Potential Individual
    description: >
      For graduates of eligible top global universities (Home Office list, last 5 years).
      Two years, or three years with a PhD. Annual application cap. Cannot be extended;
      switch to another route. First-time applicants need English at CEFR B2.
    requires_sponsor: false
    requires_endorsement: false
    salary_threshold_pence: 0
    duration_years: 2

  - slug: scale-up
    name: Scale-up
    description: >
      For workers joining qualifying high-growth companies. Requires sponsor for the first
      6 months, then free to change employers. Salary threshold £39,100/yr or the going
      rate, whichever is higher.
    requires_sponsor: true
    requires_endorsement: false
    salary_threshold_pence: 3910000   # £39,100/yr
    duration_years: 2

  - slug: intra-company-transfer
    name: Senior or Specialist Worker (ICT)
    description: >
      For multinational companies transferring established employees to a UK branch.
      Requires sponsor and a minimum salary of £48,500/yr, or the going rate if higher.
      Previously called Intra-Company Transfer.
    requires_sponsor: true
    requires_endorsement: false
    salary_threshold_pence: 4850000   # £48,500/yr
    duration_years: 5

  - slug: graduate
    name: Graduate
    description: >
      Post-study work visa for graduates of UK universities. No sponsor needed, no salary
      threshold, no job offer required. Currently 2 years (3 years with a PhD). Applications
      from 1 January 2027 are expected to be 18 months for most non-PhD graduates.
    requires_sponsor: false
    requires_endorsement: false
    salary_threshold_pence: 0
    duration_years: 2

